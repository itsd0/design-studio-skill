name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rule fixtures + shipped-artifact regression + schema pin
        run: python3 tests/run_tests.py
      - name: Lint every shipped HTML (zero P0/P1)
        run: |
          files="index.html $(ls assets/*.html demo/*.html)"
          # shellcheck disable=SC2086
          python3 scripts/lint.py $files | tee lint.out
          p1=$(grep -cE '^\s+\[P1\]' lint.out || true)
          if grep -qE 'FAIL \(fix P0' lint.out || [ "$p1" != "0" ]; then
            echo "lint gate failed"; exit 1
          fi

  render:
    name: render gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chrome is preinstalled on ubuntu-latest
        run: google-chrome --version
      - name: Render every shipped HTML (zero P0/P1)
        run: |
          files="index.html $(ls assets/*.html demo/*.html)"
          # shellcheck disable=SC2086
          python3 scripts/verify.py --require-browser $files | tee verify.out
          p1=$(grep -cE '^\s+\[P1\]' verify.out || true)
          if grep -qE 'FAIL' verify.out || [ "$p1" != "0" ]; then
            echo "render gate failed"; exit 1
          fi
      - name: Render the composed section library
        run: |
          python3 tests/compose.py assets/prototype-seed.html assets/section-skeletons.html > /tmp/composed.html
          python3 scripts/verify.py --require-browser /tmp/composed.html | tee compose.out
          if grep -qE 'FAIL' compose.out; then echo "compose gate failed"; exit 1; fi

  contract:
    name: contract + craft gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every artifact must match its DESIGN.md
        run: |
          python3 scripts/contract.py demo/landing.html --design demo/design.md | tee contract.out
          if grep -qE 'FAIL' contract.out; then echo "contract gate failed"; exit 1; fi
      - name: Every artifact must pass the craft scorecard
        run: |
          files="index.html $(ls assets/*.html demo/*.html)"
          # shellcheck disable=SC2086
          python3 scripts/score.py $files | tee score.out
          if grep -qE 'FAIL' score.out; then echo "craft gate failed"; exit 1; fi
      - name: The design system extractor must round-trip
        run: |
          python3 scripts/extract.py index.html --out /tmp/extracted | tee extract.out
          grep -q -- "--accent" /tmp/extracted/tokens.css
      - name: The toolchain must be complete
        run: python3 scripts/ds.py doctor

  pages-smoke:
    name: pages smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [test, render, contract]
    steps:
      - name: Probe live URLs (retry until the Pages build lands)
        run: |
          for attempt in $(seq 1 20); do
            ok=1
            for p in "" demo/landing.html demo/dashboard.html demo/agent.html demo/deck.html; do
              curl -fsS -o /dev/null "https://itsd0.github.io/design-studio-skill/$p" || ok=0
            done
            if [ "$ok" = "1" ]; then echo "pages smoke OK"; exit 0; fi
            echo "attempt $attempt: pages not live yet, waiting 15s"
            sleep 15
          done
          echo "pages smoke failed after 20 attempts"; exit 1
