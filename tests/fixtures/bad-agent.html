<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bad agent fixture</title>
  <style>
    :root {
      --bg: #fafaf7; --surface: #ffffff; --fg: #1a1916;
      --muted: #6b6964; --border: #e8e5df; --accent: #c96442;
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .eyebrow { color: var(--accent); }
    .cta { background: var(--accent); }
    .badge { border-color: var(--accent); }
  </style>
</head>
<body data-artifact="agent">
  <div data-run="bad-run">
    <h1>Run detail</h1>
    <div data-tool-call="SENTRY_LIST_ISSUES">
      <p>Tool output with no status and no latency.</p>
    </div>
    <p class="working">Working — fetching errors…</p>
    <button type="button" data-destructive="restart-node">Restart node now</button>
    <div data-approval="restart-plan">
      <button type="button" data-destructive="restart-node">Restart node</button>
      <button type="button">Approve plan</button>
      <button type="button">Reject</button>
    </div>
  </div>
</body>
</html>
